<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bills Coming Soon Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .phone {
      width: 320px;
      height: 640px;
      background: #0d0d0d;
      border-radius: 40px;
      border: 2px solid rgba(255,255,255,0.1);
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }

    .statusbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      flex-shrink: 0;
    }
    .statusbar .time { font-size: 13px; font-weight: 600; color: white; }
    .statusbar .icons { font-size: 11px; color: rgba(255,255,255,0.7); }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 16px;
      flex-shrink: 0;
    }
    .back-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5);
      font-size: 15px;
    }
    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: white;
    }

    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 28px 60px;
      text-align: center;
    }

    .icon-wrap {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(212,168,67,0.10);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }

    .icon-wrap svg {
      width: 36px; height: 36px;
      stroke: #d4a843;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .heading {
      font-size: 19px;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
    }

    .body-text {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      line-height: 1.65;
      max-width: 230px;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="statusbar">
      <span class="time">11:18</span>
      <span class="icons">▲▲▲ 5G 77%</span>
    </div>

    <div class="header">
      <div class="back-btn">&#8592;</div>
      <span class="header-title">Pay Bills</span>
    </div>

    <div class="body">
      <div class="icon-wrap">
        <!-- Zap / lightning bolt -->
        <svg viewBox="0 0 24 24">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
      </div>

      <p class="heading">Coming Soon</p>
      <p class="body-text">
        Bill payments — airtime, data, cable TV, and electricity — are on their way. We'll let you know as soon as they're live.
      </p>
    </div>
  </div>

</body>
</html>
