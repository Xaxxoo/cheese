<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Statements — CheesePay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#0a0a0a;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:40px 20px;gap:20px;
}

.lbl{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.18)}

.phone{
  width:320px;height:680px;
  background:#0d0d0d;
  border-radius:44px;border:1.5px solid rgba(255,255,255,.08);
  overflow:hidden;
  box-shadow:
    0 40px 80px rgba(0,0,0,.9),
    0 0 0 1px rgba(255,255,255,.03);
  display:flex;flex-direction:column;
}

/* Status bar */
.sb{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;flex-shrink:0;
}
.sb-time{font-size:13px;font-weight:600;color:white}
.sb-icons{font-size:11px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:3px}

/* Page header */
.ph{
  padding:6px 22px 18px;
  display:flex;justify-content:space-between;align-items:flex-start;
  flex-shrink:0;
}
.ph-left h2{font-size:22px;font-weight:700;color:white;line-height:1.18;letter-spacing:-.3px}
.ph-left p{font-size:11px;color:rgba(255,255,255,.3);margin-top:5px;line-height:1.4}
.yr-btn{
  margin-top:3px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.09);
  border-radius:20px;padding:5px 12px;
  font-size:11px;font-weight:500;color:rgba(255,255,255,.5);
  white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;gap:4px;
}

/* ── Stack ─────────────────────────────────────────────── */
.stack-outer{
  flex:1;
  padding:0 18px;
  position:relative;
  overflow:hidden;
}

/*
  5 cards. Each card is absolutely positioned.
  Back cards are above (lower top value) and each shows
  a strip. Progressive scaling creates depth.

  Strip reveal heights (px from card's top that peek out):
    card[0] Jan  → 64px peek  (furthest back, most visible)
    card[1] Feb  → 52px peek
    card[2] Mar  → 42px peek
    card[3] Apr  → 34px peek
    card[4] May  → full (active)

  Positions (top of each card):
    Jan  top = 0
    Feb  top = 64
    Mar  top = 64+52 = 116
    Apr  top = 116+42 = 158
    May  top = 158+34 = 192   ← active card
*/

.card{
  position:absolute;
  left:0;right:0;
  /* transition handled by JS for spring feel */
  transition:
    top .38s cubic-bezier(.32,1.42,.56,1),
    transform .38s cubic-bezier(.32,1.42,.56,1),
    box-shadow .38s ease,
    border-color .38s ease,
    opacity .3s ease;
  will-change:transform,top;
  overflow:hidden;
}

/* Radius system: back cards 18px, active 26px (set per state) */

/* ── Shared card surface ── */
.card-inner{
  width:100%;
  background:linear-gradient(160deg,#2a2212 0%,#1f1a0c 100%);
  border:1px solid rgba(212,168,67,.12);
}

/* ── Collapsed strip ── */
.card-strip{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
  height:100%;           /* height = peek amount, set inline */
}
.strip-month{
  font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
  color:rgba(255,255,255,.38);
  transition:color .3s ease;
}
.strip-ring{
  width:26px;height:26px;border-radius:50%;
  border:1.5px solid rgba(212,168,67,.16);
  display:flex;align-items:center;justify-content:center;
}
.strip-ring-inner{
  width:18px;height:18px;border-radius:50%;
  border:1px dashed rgba(212,168,67,.12);
}

/* ── Active (expanded) card ── */
.card-body{
  padding:22px 20px 26px;
  position:relative;
}

.stamp{
  position:absolute;top:22px;right:18px;
  width:54px;height:54px;border-radius:50%;
  border:1.5px solid rgba(212,168,67,.2);
  display:flex;align-items:center;justify-content:center;
}
.stamp-inner{
  width:42px;height:42px;border-radius:50%;
  border:1px dashed rgba(212,168,67,.14);
  display:flex;align-items:center;justify-content:center;
  font-size:7px;font-weight:700;letter-spacing:.05em;
  color:rgba(212,168,67,.28);text-align:center;line-height:1.4;
}

.active-tag{
  font-size:8.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(212,168,67,.4);margin-bottom:4px;
}
.active-month{
  font-size:24px;font-weight:800;color:white;
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px;
}
.active-acct{font-size:11px;color:rgba(255,255,255,.26);letter-spacing:.02em}

.divider{height:1px;background:rgba(255,255,255,.05);margin:20px 0}

.close-lbl{
  font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(212,168,67,.45);margin-bottom:7px;
}
.close-val{
  font-size:38px;font-weight:800;color:#d4a843;
  letter-spacing:-1px;line-height:1;
}

/* ── Bottom ── */
.bottom{
  padding:12px 22px 22px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.hint{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.15);
  display:flex;align-items:center;gap:8px;
}
.hint::before,.hint::after{
  content:'';width:18px;height:1px;background:rgba(255,255,255,.08);
}
.blbl{
  font-size:10px;text-transform:uppercase;letter-spacing:.12em;
  color:rgba(255,255,255,.18);
}
</style>
</head>
<body>

<div class="lbl">Statements — CheesePay</div>

<div class="phone">
  <div class="sb">
    <span class="sb-time">11:18</span>
    <span class="sb-icons">▲▲▲ &nbsp;5G &nbsp;77%</span>
  </div>

  <div class="ph">
    <div class="ph-left">
      <h2>Your Bank<br/>Statements</h2>
      <p>January – May 2026<br/>5 statements available</p>
    </div>
    <div class="yr-btn">2026 ▾</div>
  </div>

  <div class="stack-outer" id="stack"></div>

  <div class="bottom">
    <div class="hint">swipe or tap to browse</div>
    <div class="blbl">Closing Balance</div>
  </div>
</div>

<script>
/* ─── Data ─────────────────────────────────────── */
const MONTHS = [
  { label:'January 2026',  short:'JAN\n2026', acct:'452XXXXX 4821', close:'$1,100.00' },
  { label:'February 2026', short:'FEB\n2026', acct:'452XXXXX 4821', close:'$1,920.00' },
  { label:'March 2026',    short:'MAR\n2026', acct:'452XXXXX 4821', close:'$2,780.00' },
  { label:'April 2026',    short:'APR\n2026', acct:'452XXXXX 4821', close:'$3,200.00' },
  { label:'May 2026',      short:'MAY\n2026', acct:'452XXXXX 4821', close:'$4,850.50' },
]

/* ─── Layout config ─────────────────────────────
   The active card sits at the bottom.
   Back cards peek above it with increasing strip heights.
   Positions are defined relative to the active card's top.
   peekHeights[i] = px visible for card i positions behind active
   i=0 → 1 card behind (April when May is active)
   i=1 → 2 cards behind (March)   etc.
──────────────────────────────────────────────── */
const PEEK    = [38, 50, 60, 70]   // back cards: April,March,Feb,Jan
const SCALES  = [0.99, 0.98, 0.97, 0.95]
const ACTIVE_CARD_H = 242          // px — front card height
const STACK_TOP     = 8            // padding from top of stack area

/* active card top = sum of all peeks */
const ACTIVE_TOP = STACK_TOP + PEEK.reduce((a,b)=>a+b,0)

/* ─── State ──────────────────────────────────── */
let activeIdx = MONTHS.length - 1  // May

/* ─── Build DOM ──────────────────────────────── */
const stack = document.getElementById('stack')
const cards = []

MONTHS.forEach((m, i) => {
  const el = document.createElement('div')
  el.className = 'card'
  el.innerHTML = `
    <div class="card-inner" id="ci-${i}">
      <!-- collapsed strip -->
      <div class="card-strip" id="strip-${i}">
        <span class="strip-month">${m.label}</span>
        <div class="strip-ring"><div class="strip-ring-inner"></div></div>
      </div>
      <!-- expanded body (only shown when active) -->
      <div class="card-body" id="body-${i}" style="display:none">
        <div class="stamp">
          <div class="stamp-inner">${m.short.replace('\n','<br/>')}</div>
        </div>
        <div class="active-tag">Statement</div>
        <div class="active-month">${m.label}</div>
        <div class="active-acct">Account no. : ${m.acct}</div>
        <div class="divider"></div>
        <div class="close-lbl">Closing Balance</div>
        <div class="close-val">${m.close}</div>
      </div>
    </div>`
  stack.appendChild(el)
  cards.push(el)

  /* click back-card to make it active */
  el.addEventListener('click', () => {
    if (i !== activeIdx) setActive(i)
  })
})

/* ─── Layout ──────────────────────────────────── */
function layout(animate) {
  /* build ordered list: back-cards from furthest to closest, then active */
  const order = []
  for (let behind = PEEK.length; behind >= 1; behind--) {
    const idx = ((activeIdx - behind) % MONTHS.length + MONTHS.length) % MONTHS.length
    order.push({ idx, behind })
  }
  order.push({ idx: activeIdx, behind: 0 })

  order.forEach(({ idx, behind }, pos) => {
    const el   = cards[idx]
    const ci   = el.querySelector(`#ci-${idx}`)
    const strip= el.querySelector(`#strip-${idx}`)
    const body = el.querySelector(`#body-${idx}`)

    if (!animate) el.style.transition = 'none'
    else          el.style.transition =
      'top .38s cubic-bezier(.32,1.42,.56,1),' +
      'transform .38s cubic-bezier(.32,1.42,.56,1),' +
      'box-shadow .38s ease,border-color .38s ease,opacity .3s ease'

    if (behind === 0) {
      /* ── Active card ── */
      el.style.top       = ACTIVE_TOP + 'px'
      el.style.transform = 'scale(1)'
      el.style.zIndex    = 10
      el.style.cursor    = 'grab'

      ci.style.borderRadius = '26px'
      ci.style.border       = '1px solid rgba(212,168,67,.3)'
      ci.style.boxShadow    =
        '0 20px 60px rgba(0,0,0,.65),' +
        '0 8px 20px rgba(0,0,0,.4),' +
        '0 0 50px rgba(212,168,67,.05),' +
        'inset 0 1px 0 rgba(255,255,255,.04)'

      strip.style.display = 'none'
      body.style.display  = 'block'

    } else {
      /* ── Collapsed card ── */
      const peekIdx = behind - 1                        // 0=closest, 3=furthest
      const clampedPeek = Math.min(peekIdx, PEEK.length - 1)

      /* top = active card top − cumulative peek from this card down */
      let cumPeek = 0
      for (let b = 1; b <= behind; b++) {
        const pi = Math.min(b - 1, PEEK.length - 1)
        cumPeek += PEEK[pi]
      }
      const cardTop = ACTIVE_TOP - cumPeek

      const sc = SCALES[Math.min(clampedPeek, SCALES.length - 1)]

      el.style.top       = cardTop + 'px'
      el.style.transform = `scale(${sc})`
      el.style.zIndex    = pos
      el.style.cursor    = 'pointer'

      const peekH = PEEK[clampedPeek]
      /* Top corners rounded, bottom corners straight so they
         tuck cleanly under the card in front — no pill shape */
      ci.style.borderRadius = '20px 20px 0 0'
      ci.style.border       = '1px solid rgba(212,168,67,.1)'
      ci.style.borderBottom = 'none'
      ci.style.boxShadow    =
        '0 6px 18px rgba(0,0,0,.45),' +
        '0 2px 4px rgba(0,0,0,.3)'

      strip.style.display  = 'flex'
      strip.style.height   = peekH + 'px'
      body.style.display   = 'none'
    }

    if (!animate) {
      /* Force reflow so transition isn't skipped */
      el.offsetHeight
      el.style.transition = ''
    }
  })
}

/* ─── Set active card ────────────────────────── */
function setActive(newIdx) {
  activeIdx = newIdx
  layout(true)
}

/* ─── Drag / swipe on active card ───────────── */
let startX = 0, dragging = false, busy = false

const getActive = () => cards[activeIdx]

function applyDrag(dx) {
  const el = getActive()
  el.style.transition = 'none'
  el.style.transform  = `translateX(${dx}px) rotate(${dx * 0.04}deg)`
}

function springBack() {
  const el = getActive()
  el.style.transition = 'transform .35s cubic-bezier(.32,1.42,.56,1)'
  el.style.transform  = 'scale(1)'
  setTimeout(() => { el.style.transition = '' }, 400)
}

function flyAway(dir) {
  if (busy) return
  busy = true

  const flyCard = getActive()
  const next    = (activeIdx + (dir === 'left' ? -1 : 1) + MONTHS.length) % MONTHS.length
  const sign    = dir === 'left' ? -1 : 1

  flyCard.style.transition = 'transform .28s cubic-bezier(.4,0,.6,1), opacity .25s ease'
  flyCard.style.transform  = `translateX(${sign * 130}%) rotate(${sign * 10}deg)`
  flyCard.style.opacity    = '0'

  setTimeout(() => {
    flyCard.style.transition = 'none'
    flyCard.style.transform  = ''
    flyCard.style.opacity    = '1'
    flyCard.offsetHeight          // force reflow before layout re-adds transition
    busy = false
    setActive(next)
  }, 280)
}

/* Touch */
stack.addEventListener('touchstart', e => {
  if (e.target.closest('.card') === getActive()) {
    startX = e.touches[0].clientX; dragging = true
  }
}, { passive: true })

stack.addEventListener('touchmove', e => {
  if (!dragging) return
  applyDrag(e.touches[0].clientX - startX)
}, { passive: true })

stack.addEventListener('touchend', e => {
  if (!dragging) return; dragging = false
  const dx = e.changedTouches[0].clientX - startX
  Math.abs(dx) > 40 ? flyAway(dx < 0 ? 'left' : 'right') : springBack()
}, { passive: true })

/* Mouse */
stack.addEventListener('mousedown', e => {
  if (e.target.closest('.card') === getActive()) {
    startX = e.clientX; dragging = true
  }
})
window.addEventListener('mousemove', e => {
  if (!dragging) return
  applyDrag(e.clientX - startX)
})
window.addEventListener('mouseup', e => {
  if (!dragging) return; dragging = false
  const dx = e.clientX - startX
  Math.abs(dx) > 40 ? flyAway(dx < 0 ? 'left' : 'right') : springBack()
})

/* ─── Init ───────────────────────────────────── */
layout(false)
</script>
</body>
</html>
