<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYC Page Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .phone {
      width: 320px;
      height: 640px;
      background: #0d0d0d;
      border-radius: 40px;
      border: 2px solid rgba(255,255,255,0.1);
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
    }

    /* Status bar */
    .statusbar {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      flex-shrink: 0;
    }
    .statusbar .time { font-size: 13px; font-weight: 600; color: white; }
    .statusbar .icons { font-size: 11px; color: rgba(255,255,255,0.7); }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px 16px;
      flex-shrink: 0;
    }
    .back-btn {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.5);
      font-size: 15px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: white;
    }

    /* Body */
    .body {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 24px 40px;
      text-align: center;
    }

    .icon-wrap {
      width: 76px; height: 76px;
      border-radius: 50%;
      background: rgba(212,168,67,0.10);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }

    .icon-wrap svg {
      width: 36px; height: 36px;
      stroke: #d4a843;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .heading {
      font-size: 19px;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    .body-text {
      font-size: 13px;
      color: rgba(255,255,255,0.45);
      line-height: 1.6;
      margin-bottom: 28px;
      max-width: 240px;
    }

    .tg-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 16px;
      background: #d4a843;
      color: black;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .tg-btn svg {
      width: 16px; height: 16px;
      fill: black;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="statusbar">
      <span class="time">11:18</span>
      <span class="icons">▲▲▲ 5G 77%</span>
    </div>

    <div class="header">
      <div class="back-btn">&#8592;</div>
      <span class="header-title">Verify Identity</span>
    </div>

    <div class="body">
      <!-- Clock icon -->
      <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </div>

      <p class="heading">KYC Not Open Yet</p>

      <p class="body-text">
        We are currently in a closed testing phase and KYC verification is not open to the general public yet.<br /><br />
        If you personally know the founder you can reach out directly to get verified early.
      </p>

      <a class="tg-btn" href="https://t.me/Xaxxoo23" target="_blank">
        <!-- Telegram paper plane icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.94 2.06a1 1 0 0 0-1-.25L2.44 8.3a1 1 0 0 0 .06 1.92l4.64 1.43 2.07 6.38a1 1 0 0 0 .66.65 1 1 0 0 0 .91-.24l2.54-2.42 4.74 3.48a1 1 0 0 0 .6.2 1 1 0 0 0 .98-.8l3-15a1 1 0 0 0-.7-1.84zM9.39 15.71l-1.32-4.08 7.93-5.1-6.61 9.18zm1.32 2.14-.42-1.29 1.06-1.01zm8.12.53-4.9-3.6 3.96-9.57z"/>
        </svg>
        Message on Telegram
      </a>
    </div>
  </div>

</body>
</html>
